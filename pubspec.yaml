name: oscillo_ui
description: "An app for controlling oscilloscope especially RIGOL DS1054Z"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  connectivity_plus: ^6.1.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.1
  get_it: ^8.0.3
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: any
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  objectbox_generator: any

flutter:
  uses-material-design: true
  generate: true
