name: oscillo_ui
description: "An app for controlling oscilloscope especially RIGOL DS1054Z"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  fluent_ui:
    git: https://github.com/bdlukaa/fluent_ui.git
  connectivity_plus: ^6.1.3
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.1
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0
  path_provider: ^2.1.5
  sizer: ^3.0.5
  image: ^4.5.2
  opencv_dart: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  objectbox_generator: ^4.1.0

flutter:
  uses-material-design: true
  generate: true
