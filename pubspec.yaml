name: oscillo_ui
description: "An app for controlling oscilloscope especially RIGOL DS1054Z"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  connectivity_plus: ^6.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  google_fonts: ^6.2.1
  intl: ^0.20.1
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  objectbox_generator: any

flutter:
  uses-material-design: true
